<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>図形の面積ラボ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{--bg:#eef6f3;--panel:#fff;--ink:#17324d;--sub:#5b7186;--line:#b9d3ca;--acc:#2a9d8f;--sel:#f4a300;--ng:#d6455d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10201f;--panel:#182b2a;--ink:#e6f2ee;--sub:#9db8b0;--line:#2f4b47;--acc:#5fd0c0;--ng:#ff7a90}}
:root[data-theme="dark"]{--bg:#10201f;--panel:#182b2a;--ink:#e6f2ee;--sub:#9db8b0;--line:#2f4b47;--acc:#5fd0c0;--ng:#ff7a90}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.6 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
main{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 12px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--acc)}button:focus-visible,input:focus-visible{outline:3px solid var(--sel);outline-offset:1px}
button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sw{width:32px;height:32px;min-height:0;padding:0;border-radius:50%}.sw.on{outline:3px solid var(--ink)}
.box{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
svg.cv{width:100%;height:auto;display:block;background:var(--panel);border:2px solid var(--line);border-radius:14px;touch-action:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=number]{width:64px;padding:4px 6px;border:2px solid var(--line);border-radius:8px;background:var(--bg)}
input[type=text]{flex:1;min-width:140px;padding:6px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg)}
.area{font-size:18px;font-weight:700}.sub{color:var(--sub);font-size:13px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.opts button{font-size:18px}.opts .ok{background:var(--acc);color:#fff;border-color:var(--acc)}.opts .ng{border-color:var(--ng);color:var(--ng)}
.q svg{width:100%;max-width:420px;display:block;margin:0 auto;background:var(--bg);border-radius:12px}
.hid{display:none}
</style></head><body><main>
<h1>📐 図形の面積ラボ</h1>
<div class="tabs"><button id="t1" class="on">つくる</button><button id="t2">ミニクイズ</button></div>

<section id="p1">
<div class="bar" id="add"></div>
<div class="bar" id="tools">
<button data-a="cut">✂️ 切る</button><button data-a="rot">🔄 回す</button><button data-a="flip">🪞 うら返す</button><button data-a="del">🧽 消す</button>
<button data-a="undo">↩️ もどる</button><button data-a="redo">↪️ すすむ</button><button data-a="clear">🗑️ 全て消す</button><button data-a="share">🔗 リンク</button>
</div>
<div class="bar" id="cols"></div>
<div class="sub" id="ch" style="min-height:22px"></div>
<svg class="cv" id="cv" viewBox="0 0 600 420" aria-label="方眼のキャンバス（1マス1cm）"></svg>
<div class="sub">マス目は1辺1cm。図形をドラッグして動かせます。</div>
<div class="box" id="info"></div>
<div class="box"><div class="row"><b>📝 テキスト</b><input type="text" id="tx" placeholder="たとえば「底辺」「高さ」" maxlength="30"><button id="txb">追加</button></div></div>
<div class="box hid" id="lk"><div class="sub">このリンクを開くと、いまの図形が再現されます。</div><input type="text" id="lku" readonly style="width:100%"></div>
</section>

<section id="p2" class="hid"><div class="box q" id="quiz"></div></section>
</main>
<script>
const U=30,GW=20,GH=14,$=s=>document.querySelector(s);
const COL=['#8ecae6','#ffd166','#95d5b2','#f4a6c0','#cdb4db','#ffb56b'];
const T={
 sq:{n:'正方形',p:[['1辺',3]],pts:a=>[[0,0],[a[0],0],[a[0],a[0]],[0,a[0]]],e:a=>`${a[0]}×${a[0]}`,v:a=>a[0]*a[0],h:'1辺×1辺'},
 rect:{n:'長方形',p:[['よこ',4],['たて',3]],pts:a=>[[0,0],[a[0],0],[a[0],a[1]],[0,a[1]]],e:a=>`${a[0]}×${a[1]}`,v:a=>a[0]*a[1],h:'たて×よこ'},
 tri:{n:'三角形',p:[['底辺',4],['高さ',3]],pts:a=>[[0,a[1]],[a[0],a[1]],[0,0]],e:a=>`${a[0]}×${a[1]}÷2`,v:a=>a[0]*a[1]/2,h:'底辺×高さ÷2'},
 para:{n:'平行四辺形',p:[['底辺',4],['高さ',3],['ずれ',1]],pts:a=>[[a[2],0],[a[0]+a[2],0],[a[0],a[1]],[0,a[1]]],e:a=>`${a[0]}×${a[1]}`,v:a=>a[0]*a[1],h:'底辺×高さ'},
 trap:{n:'台形',p:[['上底',2],['下底',4],['高さ',3]],pts:a=>{const o=(a[1]-a[0])/2;return[[0,a[2]],[a[1],a[2]],[o+a[0],0],[o,0]]},e:a=>`(${a[0]}+${a[1]})×${a[2]}÷2`,v:a=>(a[0]+a[1])*a[2]/2,h:'(上底+下底)×高さ÷2'},
 rhomb:{n:'ひし形',p:[['対角線A',4],['対角線B',3]],pts:a=>[[a[0]/2,0],[a[0],a[1]/2],[a[0]/2,a[1]],[0,a[1]/2]],e:a=>`${a[0]}×${a[1]}÷2`,v:a=>a[0]*a[1]/2,h:'対角線×対角線÷2'}
};
let cutMode=false,cutA=null,hov=null,S={n:0,sh:[]},sel=null,hist=[],fut=[],col=COL[0],drag=null;
try{const h=location.hash.slice(1);if(h)S=JSON.parse(decodeURIComponent(escape(atob(h))))}catch(e){}
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),cur=()=>S.sh.find(s=>s.id===sel);
const save=()=>{hist.push(JSON.stringify(S));if(hist.length>60)hist.shift();fut=[]};
const sa=P=>Math.abs(P.reduce((n,p,i)=>{const q=P[(i+1)%P.length];return n+p[0]*q[1]-q[0]*p[1]},0))/2,ar=s=>s.t==='poly'?sa(s.P):T[s.t].v(s.a);
function pts(s){let P=s.t==='poly'?s.P:T[s.t].pts(s.a);const W=Math.max(...P.map(p=>p[0]));
 P=P.map(([x,y])=>[s.f?W-x:x,y]);for(let i=0;i<s.r;i++)P=P.map(([x,y])=>[-y,x]);
 const mx=Math.min(...P.map(p=>p[0])),my=Math.min(...P.map(p=>p[1]));
 return P.map(([x,y])=>[x-mx+s.x,y-my+s.y])}
const fmt=v=>Number.isInteger(v)?v:+v.toFixed(2);
function render(){
 let h='<defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" style="stroke:var(--line)" stroke-width="1"/></pattern></defs><rect width="600" height="420" fill="url(#g)"/>';
 for(const s of S.sh){const on=s.id===sel;
  if(s.t==='text')h+=`<text data-id="${s.id}" x="${s.x*U}" y="${s.y*U}" font-size="20" dominant-baseline="hanging" style="fill:var(--ink)" ${on?'text-decoration="underline"':''}>${s.txt.replace(/</g,'&lt;')}</text>`;
  else h+=`<polygon data-id="${s.id}" points="${pts(s).map(p=>p[0]*U+','+p[1]*U).join(' ')}" fill="${s.c}" fill-opacity=".85" stroke="${on?'#f4a300':'#17324d'}" stroke-width="${on?4:2}" ${on?'stroke-dasharray="7 4"':''} stroke-linejoin="round"/>`}
 if(cutMode&&cutA){h+=`<circle cx="${cutA[0]*U}" cy="${cutA[1]*U}" r="6" fill="#d6455d"/>`;if(hov)h+=`<line x1="${cutA[0]*U}" y1="${cutA[1]*U}" x2="${hov[0]*U}" y2="${hov[1]*U}" stroke="#d6455d" stroke-width="3" stroke-dasharray="8 5"/>`}
 $('#cv').innerHTML=h;
 $('#ch').textContent=cutMode?(cutA?'切りたい線の、もう1つの点をクリックしてね':'切りたい図形を選んで、線の1つ目の点（方眼の交点）をクリック'):'';
 document.querySelector('[data-a=cut]').classList.toggle('on',cutMode);
 const s=cur(),tot=S.sh.filter(x=>x.t!=='text').reduce((n,x)=>n+ar(x),0);
 let i=`<div class="sub">全部の面積の合計：<b>${fmt(tot)} cm²</b></div>`;
 if(s&&s.t==='poly')i=`<div class="area">切った形の面積 ＝ ${fmt(ar(s))} cm²</div><div class="sub">切った2つの形の面積を足すと、もとの図形と同じです。動かして、別の形に組み合わせてみよう。</div>`+i;else if(s&&s.t!=='text'){const t=T[s.t];i=`<div class="area">${t.n}の面積 ＝ ${t.e(s.a)} ＝ ${fmt(t.v(s.a))} cm²</div><div class="sub">公式：${t.h}</div><div class="row" style="margin-top:6px">`+t.p.map((p,k)=>`${p[0]} <input type="number" data-i="${k}" min="${k===2&&s.t==='para'?0:1}" max="14" step="1" value="${s.a[k]}"> cm`).join('')+`</div><div class="sub" style="margin-top:6px">${s.t==='trap'?'上底と下底の差が奇数のときは、半マスずれます。':''}</div>`+i}
 else if(s)i=`<div class="sub">テキストを選んでいます。下の欄で書き換えて「変更」を押してください。</div>`+i;
 else i=`<div class="sub">図形を追加して、クリックで選んでみよう。</div>`+i;
 $('#info').innerHTML=i;$('#txb').textContent=s&&s.t==='text'?'変更':'追加';
 document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===col));
}
$('#add').innerHTML=Object.keys(T).map(k=>`<button data-add="${k}">＋${T[k].n}</button>`).join('');
$('#cols').innerHTML='<span class="sub" style="align-self:center">🎨 色ぬり</span>'+COL.map(c=>`<button class="sw" data-c="${c}" style="background:${c}" aria-label="色 ${c}"></button>`).join('');
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.add){save();const k=b.dataset.add,n=++S.n;S.sh.push({id:n,t:k,a:T[k].p.map(p=>p[1]),x:2+(n%4)*2,y:2+(n%3)*2,r:0,f:0,c:col});sel=n;render()}
 else if(b.dataset.c){col=b.dataset.c;const s=cur();if(s&&s.t!=='text'){save();s.c=col}render()}
 else if(b.dataset.a){const s=cur(),a=b.dataset.a;
  if(a==='cut'){cutMode=!cutMode;cutA=null;hov=null}
  if(a==='rot'&&s&&s.t!=='text'){save();s.r=(s.r+1)%4}
  if(a==='flip'&&s&&s.t!=='text'){save();s.f^=1}
  if(a==='del'&&s){save();S.sh=S.sh.filter(x=>x!==s);sel=null}
  if(a==='undo'&&hist.length){fut.push(JSON.stringify(S));S=JSON.parse(hist.pop());sel=null}
  if(a==='redo'&&fut.length){hist.push(JSON.stringify(S));S=JSON.parse(fut.pop());sel=null}
  if(a==='clear'&&S.sh.length){save();S.sh=[];sel=null}
  if(a==='share'){const u=location.href.split('#')[0]+'#'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#lk').classList.remove('hid');$('#lku').value=u;$('#lku').select();try{history.replaceState(null,'','#'+u.split('#')[1])}catch(e){}try{navigator.clipboard.writeText(u)}catch(e){}}
  render()}
});
$('#info').addEventListener('change',e=>{const s=cur(),i=e.target.dataset.i;if(!s||i==null)return;save();s.a[i]=cl(Math.round(+e.target.value)||1,i==2&&s.t==='para'?0:1,14);render()});
$('#txb').onclick=()=>{const v=$('#tx').value.trim();if(!v)return;save();const s=cur();if(s&&s.t==='text')s.txt=v;else{const n=++S.n;S.sh.push({id:n,t:'text',txt:v,x:2,y:1});sel=n}$('#tx').value='';render()};
const cv=$('#cv'),pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*GW,(e.clientY-r.top)/r.height*GH]};
cv.addEventListener('pointerdown',e=>{const id=e.target.dataset.id;
 if(cutMode){const[qx,qy]=pt(e),p=[cl(Math.round(qx),0,GW),cl(Math.round(qy),0,GH)];
  if(!cutA){if(id&&+id!==sel){sel=+id;render();return}const c=cur();if(!c||c.t==='text')return;cutA=p;render();return}
  if(p[0]===cutA[0]&&p[1]===cutA[1])return;
  const ok=doCut(cur(),cutA,p);if(ok)cutMode=false;cutA=null;hov=null;render();if(!ok)$('#ch').textContent='その線では切れません。図形の中を通る線にしてね。';return}
if(!id){sel=null;render();return}
 sel=+id;const s=cur(),[px,py]=pt(e);save();drag={sx:px,sy:py,ox:s.x,oy:s.y,m:0};cv.setPointerCapture(e.pointerId);if(s.t==='text')$('#tx').value=s.txt;render()});
cv.addEventListener('pointermove',e=>{if(cutMode&&cutA){const[qx,qy]=pt(e);hov=[cl(Math.round(qx),0,GW),cl(Math.round(qy),0,GH)];render();return}if(!drag)return;const s=cur(),[px,py]=pt(e);
 const nx=cl(Math.round(drag.ox+px-drag.sx),0,GW-1),ny=cl(Math.round(drag.oy+py-drag.sy),0,GH-1);
 if(nx!==s.x||ny!==s.y){s.x=nx;s.y=ny;drag.m=1;render()}});
cv.addEventListener('pointerup',()=>{if(drag&&!drag.m)hist.pop();drag=null});
function clip(P,A,B,g){const f=p=>g*((B[0]-A[0])*(p[1]-A[1])-(B[1]-A[1])*(p[0]-A[0])),o=[];
 for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length],fp=f(p),fq=f(q);if(fp>=0)o.push(p);
  if((fp>0&&fq<0)||(fp<0&&fq>0)){const t=fp/(fp-fq);o.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])])}}return o}
function doCut(s,A,B){const P=pts(s),a=clip(P,A,B,1),b=clip(P,A,B,-1);
 if(sa(a)<.01||sa(b)<.01)return false;
 save();S.sh=S.sh.filter(x=>x!==s);let last;
 [a,b].forEach((Q,i)=>{const mx=Math.min(...Q.map(p=>p[0])),my=Math.min(...Q.map(p=>p[1])),n=++S.n;
  S.sh.push({id:n,t:'poly',P:Q.map(p=>[p[0]-mx,p[1]-my]),x:cl(Math.round(mx)+i,0,GW-1),y:cl(Math.round(my)+i,0,GH-1),r:0,f:0,c:i?COL[(COL.indexOf(s.c)+1)%COL.length]:s.c});last=n});
 sel=last;return true}
// ---- quiz ----
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
let Q={i:0,ok:0,q:null,done:0};
function mkq(){const k=['sq','rect','tri','para','trap','rhomb'][R(0,5)];let a;
 if(k==='sq')a=[R(2,8)];else if(k==='rect')a=[R(3,9),R(2,7)];
 else if(k==='tri')a=[R(2,5)*2,R(2,7)];else if(k==='para')a=[R(3,8),R(2,6),R(1,2)];
 else if(k==='trap'){const t=R(2,5);a=[t,t+2*R(1,3),2*R(1,3)]}else a=[2*R(2,5),R(2,7)];
 const c=T[k].v(a),cand=sh([c*2,c/2,c+1,c-1,c+2,c-2,c+4]).filter(v=>Number.isInteger(v)&&v>0&&v!==c).slice(0,3);
 return{k,a,c,o:sh([c,...cand])}}
function qsvg(k,a){const P=T[k].pts(a),W=Math.max(...P.map(p=>p[0])),H=Math.max(...P.map(p=>p[1]));
 const L=(x,y,t)=>`<text x="${x}" y="${y}" font-size=".8" text-anchor="middle" style="fill:var(--ink)">${t}</text>`,D=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#d6455d" stroke-width=".07" stroke-dasharray=".25 .2"/>`;
 let l='';const o=k==='trap'?(a[1]-a[0])/2:0;
 if(k==='sq')l=L(W/2,H+.9,a[0]+'cm');
 if(k==='rect')l=L(W/2,H+.9,a[0]+'cm')+L(-.9,H/2+.3,a[1]+'cm');
 if(k==='tri')l=L(W/2,H+.9,a[0]+'cm')+L(-.9,H/2+.3,a[1]+'cm');
 if(k==='para')l=L(W/2,H+.9,a[0]+'cm')+D(a[2],0,a[2],H)+L(a[2]-.9,H/2+.3,a[1]+'cm');
 if(k==='trap')l=L(W/2,-.4,a[0]+'cm')+L(W/2,H+.9,a[1]+'cm')+D(o,0,o,H)+L(o-.9,H/2+.3,a[2]+'cm');
 if(k==='rhomb')l=D(0,H/2,W,H/2)+D(W/2,0,W/2,H)+L(W/2,H/2-.2,a[0]+'cm')+L(W/2+1.1,H/2+1.2,a[1]+'cm');
 return`<svg viewBox="-2 -1.4 ${W+4} ${H+3}"><polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="#8ecae6" fill-opacity=".85" stroke="#17324d" stroke-width=".1" stroke-linejoin="round"/>${l}</svg>`}
function showQ(){const z=$('#quiz');
 if(Q.i>=5){z.innerHTML=`<div class="area">けっか：5問中 ${Q.ok}問 正解！</div><p>${Q.ok===5?'かんぺき！面積マスターです。':Q.ok>=3?'いい調子！まちがえた形の公式をもう一度見てみよう。':'「つくる」で図形を動かしながら、公式を確かめてみよう。'}</p><button id="again" class="on">もう一度</button>`;$('#again').onclick=()=>{Q={i:0,ok:0,q:null};showQ()};return}
 const q=Q.q=mkq();Q.done=0;
 z.innerHTML=`<div class="sub">第${Q.i+1}問 / 5</div><p><b>${T[q.k].n}の面積は何cm²？</b></p>${qsvg(q.k,q.a)}<div class="opts">${q.o.map(v=>`<button data-v="${v}">${v} cm²</button>`).join('')}</div><button id="hint">💡ヒント</button><div id="fb" style="margin-top:8px"></div>`;
 $('#hint').onclick=()=>{$('#fb').innerHTML=`<span class="sub">公式：${T[q.k].h}</span>`};
 z.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{if(Q.done)return;Q.done=1;const ok=+b.dataset.v===q.c;
  if(ok)Q.ok++;b.classList.add(ok?'ok':'ng');z.querySelectorAll('.opts button').forEach(x=>{if(+x.dataset.v===q.c)x.classList.add('ok')});
  $('#fb').innerHTML=`<div class="area" style="color:${ok?'var(--acc)':'var(--ng)'}">${ok?'⭕ 正解！':'❌ ざんねん'}</div><div>${T[q.k].h} ＝ ${T[q.k].e(q.a)} ＝ ${fmt(q.c)} cm²</div><button id="nx" class="on" style="margin-top:8px">${Q.i>=4?'けっかを見る':'次の問題'}</button>`;
  $('#nx').onclick=()=>{Q.i++;showQ()}})}
$('#t1').onclick=()=>{$('#p1').classList.remove('hid');$('#p2').classList.add('hid');$('#t1').classList.add('on');$('#t2').classList.remove('on')};
$('#t2').onclick=()=>{$('#p2').classList.remove('hid');$('#p1').classList.add('hid');$('#t2').classList.add('on');$('#t1').classList.remove('on');if(!Q.q)showQ()};
render();
</script></body></html>
